server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript;
  gzip_min_length 1024;

  # The session lives in the browser's IndexedDB, keyed to this origin — so
  # the port and hostname you serve on are part of your saved maps' identity.
  # Change them and the console comes up empty; use Save session… first.

  # App files change every time you edit them: revalidate, never guess.
  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
  }

  # Lucide is versioned by the image build, so it can be cached hard.
  location /node_modules/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
